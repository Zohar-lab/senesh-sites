name: Deploy Portal to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Configure Firebase environment for build
        shell: bash
        env:
          FIREBASE_APPLET_CONFIG: ${{ secrets.FIREBASE_APPLET_CONFIG }}
          SECRET_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          SECRET_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          SECRET_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          SECRET_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          SECRET_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          SECRET_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          SECRET_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
        run: |
          node -e '
            const fs = require("fs");
            const out = [];
            const rawJson = (process.env.FIREBASE_APPLET_CONFIG || "").trim();
            if (rawJson) {
              const cfg = JSON.parse(rawJson);
              const pairs = {
                VITE_FIREBASE_API_KEY: cfg.apiKey,
                VITE_FIREBASE_AUTH_DOMAIN: cfg.authDomain,
                VITE_FIREBASE_PROJECT_ID: cfg.projectId,
                VITE_FIREBASE_STORAGE_BUCKET: cfg.storageBucket,
                VITE_FIREBASE_MESSAGING_SENDER_ID: cfg.messagingSenderId,
                VITE_FIREBASE_APP_ID: cfg.appId,
                VITE_FIREBASE_DATABASE_ID: cfg.firestoreDatabaseId,
              };
              for (const [k, v] of Object.entries(pairs)) {
                if (v) {
                  console.log("::add-mask::" + v);
                  out.push(`${k}=${v}`);
                }
              }
            } else {
              const fallbackPairs = {
                VITE_FIREBASE_API_KEY: process.env.SECRET_API_KEY,
                VITE_FIREBASE_AUTH_DOMAIN: process.env.SECRET_AUTH_DOMAIN,
                VITE_FIREBASE_PROJECT_ID: process.env.SECRET_PROJECT_ID,
                VITE_FIREBASE_STORAGE_BUCKET: process.env.SECRET_STORAGE_BUCKET,
                VITE_FIREBASE_MESSAGING_SENDER_ID: process.env.SECRET_MESSAGING_SENDER_ID,
                VITE_FIREBASE_APP_ID: process.env.SECRET_APP_ID,
                VITE_FIREBASE_DATABASE_ID: process.env.SECRET_DATABASE_ID,
              };
              for (const [k, v] of Object.entries(fallbackPairs)) {
                if (v) {
                  console.log("::add-mask::" + v);
                  out.push(`${k}=${v}`);
                }
              }
            }
            if (out.length === 0) {
              console.warn("::warning::Firebase GitHub Secrets are not configured yet; building with demo fallback until FIREBASE_APPLET_CONFIG is set.");
            }
            if (out.length > 0) {
              fs.appendFileSync(process.env.GITHUB_ENV, out.join("\n") + "\n");
            }
          '

      - name: Build production bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
